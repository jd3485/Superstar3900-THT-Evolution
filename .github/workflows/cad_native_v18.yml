name: V1.8 native KiCad9 six-sheet THT continuous OVP high-side cutoff prototype
on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  native-v18-ovp:
    runs-on: ubuntu-24.04
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@v4
      - name: Deterministically verify all eight native KiCad files against untouched V1.7
        run: |
          node --check 04_KiCad/V1.8/genera_ovp_v18.js
          node 04_KiCad/V1.8/genera_ovp_v18.js --check
      - name: Install KiCad9 native
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq software-properties-common
          sudo add-apt-repository --yes ppa:kicad/kicad-9.0-releases
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq kicad
          kicad-cli version
      - name: Register all original THT symbol libraries plus V1.8 OVP
        run: |
          mkdir -p "$HOME/.config/kicad/9.0"
          python3 - <<'PY'
          from pathlib import Path
          p=(Path.cwd()/"04_KiCad/V1.8").resolve()
          (Path.home()/".config/kicad/9.0/sym-lib-table").write_text((p/"sym-lib-table").read_text().replace("$"+"{KIPRJMOD}",str(p)))
          PY
      - name: Export actual new native KiCad9 OVP symbol library
        run: |
          mkdir -p 03_Verifiche/V1.8/native_results/symbols
          kicad-cli sym export svg --output 03_Verifiche/V1.8/native_results/symbols/ 04_KiCad/V1.8/THT_V18.kicad_sym
      - name: Strict native ERC on full six-sheet schematic
        run: |
          kicad-cli sch erc --exit-code-violations --format json --output 03_Verifiche/V1.8/native_results/erc.json 04_KiCad/V1.8/PLL_RX_HIERARCHICAL_MASTER_V1.8.kicad_sch
      - name: Export real KiCad netlists and validate ALL old and new component pin sets
        run: |
          kicad-cli sch export netlist --output 03_Verifiche/V1.8/native_results/v17_baseline.net 04_KiCad/V1.7/PLL_RX_HIERARCHICAL_MASTER_V1.7.kicad_sch
          kicad-cli sch export netlist --output 03_Verifiche/V1.8/native_results/v18_ovp.net 04_KiCad/V1.8/PLL_RX_HIERARCHICAL_MASTER_V1.8.kicad_sch
          python3 -B 03_Verifiche/V1.8/verify_ovp_native_v18.py 03_Verifiche/V1.8/native_results/v17_baseline.net 03_Verifiche/V1.8/native_results/v18_ovp.net
      - name: Export all 6 KiCad editable hierarchy pages to native SVG
        run: |
          mkdir -p 03_Verifiche/V1.8/native_results/svg
          kicad-cli sch export svg --output 03_Verifiche/V1.8/native_results/svg/ 04_KiCad/V1.8/PLL_RX_HIERARCHICAL_MASTER_V1.8.kicad_sch
          test "$(find 03_Verifiche/V1.8/native_results/svg -name '*.svg' -type f | wc -l)" -ge 6
      - name: Check comparator hysteresis analytical tolerance corners (NOT vendor simulation)
        run: |
          python3 -B 03_Verifiche/V1.8/screen_ovp_v18.py
          cp 03_Verifiche/V1.8/screen_v18.json 03_Verifiche/V1.8/native_results/
      - name: IDEALIZED ngspice high-side OVP steps (NOT vendor or hardware test)
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ngspice
          ngspice -b -o 03_Verifiche/V1.8/native_results/behavioral_ngspice.log 03_Verifiche/V1.8/OVP_IDEAL_BEHAVIORAL_V1.8.cir
          python3 -B 03_Verifiche/V1.8/verify_behavioral_ovp_v18.py 03_Verifiche/V1.8/native_results/behavioral_ngspice.log
      - name: Retain KiCad proof or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v18-THT-native-highside-OVP-UNQUALIFIED-NO-FAB-NO-TX
          path: 03_Verifiche/V1.8/native_results/
          if-no-files-found: warn
