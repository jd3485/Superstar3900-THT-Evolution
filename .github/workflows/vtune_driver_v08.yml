name: V0.8 VTUNE high-rail THT driver behavioral ngspice (NO FAB NO TX)
on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  vtune-driver:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install ngspice
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ngspice
          ngspice --version
      - name: Simulate six LM358N driver cases with limited ideal amplifier model
        run: python3 -B 03_Verifiche/V0.8/run_driver_v08.py
      - name: Upload exact decks and observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v08-vtune-ideal-driver-NOT-HARDWARE
          path: 03_Verifiche/V0.8/ngspice_results/
          if-no-files-found: warn
