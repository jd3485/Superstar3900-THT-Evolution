name: V0.9 three-state PDout passive filter ngspice (NO PLL qualification)
on:
  push:
    branches: [main, "feature/v0.9-pll-tristate-filter"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  pdout-tristate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install ngspice
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ngspice
          ngspice --version
      - name: Validate ideal three-state pulsed PDout filter cases
        run: python3 -B 03_Verifiche/V0.9/run_tristate_v09.py
      - name: Archive exact simulated decks and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v09-tristate-PFD-surrogate-NOT-LOCK
          path: 03_Verifiche/V0.9/ngspice_results/
          if-no-files-found: warn
