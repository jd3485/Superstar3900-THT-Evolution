name: THT radio - V0.1 V0.2 V0.3 V0.4 V0.5 V0.6 V0.7 V0.8 V0.9 + V1.0 CAD-first software regressions (NO FAB NO TX)
on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  static-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Baseline V0.1 structural tests
        run: python3 -B -m unittest discover -s 03_Verifiche/V0.1 -p 'test_*.py' -v
      - name: V0.2 channel plan and candidate PLL arithmetic tests
        run: python3 -B -m unittest discover -s 03_Verifiche/V0.2 -p 'test_*.py' -v
      - name: V0.3 PLL pinout and candidate THT core static checks
        run: python3 -B -m unittest discover -s 03_Verifiche/V0.3 -p 'test_*.py' -v
      - name: V0.4 VCO analytic and partial KiCad native-file static checks
        run: python3 -B -m unittest discover -s 03_Verifiche/V0.4 -p 'test_*.py' -v
      - name: V0.5 dual-varactor and RX fail-closed static bench models
        run: python3 -B -m unittest discover -s 03_Verifiche/V0.5 -p 'test_*.py' -v
      - name: V0.6 real-SPICE evidence and candidate B safety records
        run: python3 -B -m unittest discover -s 03_Verifiche/V0.6 -p 'test_*.py' -v
      - name: V0.7 VTUNE THT boost calculations and honest safety gates
        run: python3 -B -m unittest discover -s 03_Verifiche/V0.7 -p 'test_*.py' -v
      - name: V0.8 VTUNE 27V THT driver and minimum-load static model checks
        run: python3 -B -m unittest discover -s 03_Verifiche/V0.8 -p 'test_*.py' -v
      - name: V0.9 three-state phase detector filter consistency 28 tests
        run: python3 -B -m unittest discover -s 03_Verifiche/V0.9 -p 'test_*.py' -v
      - name: V1.0 CAD-first structural and continuity checks (18 tests)
        run: python3 -B -m unittest discover -s 03_Verifiche/V1.0 -p 'test_*.py' -v
