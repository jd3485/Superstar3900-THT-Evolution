name: V0.9 Native KiCad ERC on isolated PLL loop driver (NO FAB NO TX)
on:
  push:
    branches: ["feature/v0.9-pll-tristate-kicad-erc", main]
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  kicad-pll-loop-erc:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Install native KiCad CLI for ERC
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq software-properties-common
          sudo add-apt-repository --yes ppa:kicad/kicad-9.0-releases
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq kicad
          kicad-cli version
          kicad-cli sch erc --help | head -15
      - name: Confirm committed schematic matches deterministic generator
        run: |
          if [ -f 04_KiCad/V0.9/PLL_LOOP_RX_PARTIAL_V0.9.kicad_sch ]; then
            sha256sum 04_KiCad/V0.9/PLL_LOOP_RX_PARTIAL_V0.9.kicad_sch > "$RUNNER_TEMP/sch.before"
          fi
          python3 -m py_compile 04_KiCad/V0.9/genera_pll_loop_v09.py
          python3 04_KiCad/V0.9/genera_pll_loop_v09.py
          sha256sum 04_KiCad/V0.9/PLL_LOOP_RX_PARTIAL_V0.9.kicad_sch > "$RUNNER_TEMP/sch.after"
          if [ -f "$RUNNER_TEMP/sch.before" ]; then
            if ! cmp -s "$RUNNER_TEMP/sch.before" "$RUNNER_TEMP/sch.after"; then
              echo "Generator changed committed file"
              if [ "$GITHUB_EVENT_NAME" != "push" ] || [ "$GITHUB_REF" != "refs/heads/feature/v0.9-pll-tristate-kicad-erc" ]; then
                exit 1
              fi
            fi
          fi
      - name: Commit generated draft schematic on feature branch (ERC still pending)
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/v0.9-pll-tristate-kicad-erc'
        run: |
          if [ -n "$(git status --porcelain -- 04_KiCad/V0.9/PLL_LOOP_RX_PARTIAL_V0.9.kicad_sch 04_KiCad/V0.9/THT_V09.kicad_sym 04_KiCad/V0.9/sym-lib-table)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add 04_KiCad/V0.9/PLL_LOOP_RX_PARTIAL_V0.9.kicad_sch 04_KiCad/V0.9/THT_V09.kicad_sym 04_KiCad/V0.9/sym-lib-table
            git commit -m 'V0.9: check in deterministic KiCad PLL partial draft for native parser review'
            git push
          fi

      - name: Register project THT custom symbols in KiCad 9 global library table
        run: |
          mkdir -p "$HOME/.config/kicad/9.0"
          cp 04_KiCad/V0.9/sym-lib-table "$HOME/.config/kicad/9.0/sym-lib-table"
          echo "Registered THT_V09 custom symbol library for native ERC"
          cat "$HOME/.config/kicad/9.0/sym-lib-table"
      - name: Run native KiCad ERC only for V0.9 partial loop
        shell: bash
        run: |
          mkdir -p 03_Verifiche/V0.9/kicad_results
          set +e
          kicad-cli sch erc --exit-code-violations --output 03_Verifiche/V0.9/kicad_results/erc_v09.rpt 04_KiCad/V0.9/PLL_LOOP_RX_PARTIAL_V0.9.kicad_sch
          result=$?
          echo "KICAD_ERC_EXIT_CODE=$result"
          cat 03_Verifiche/V0.9/kicad_results/erc_v09.rpt || true
          exit $result
      - name: Upload native KiCad ERC logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v09-partial-kicad-erc-not-a-pcb-validation
          path: 03_Verifiche/V0.9/kicad_results/
          if-no-files-found: warn
