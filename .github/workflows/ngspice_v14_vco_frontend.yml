name: V1.4 ngspice loaded Colpitts VCO frontend (NO AC14 digital RF qualification)
on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  spice-vco-frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Install ngspice
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ngspice
          ngspice --version
      - name: Execute actual unloaded-model baseline + frontend input-load sweep
        run: |
          python3 -B 03_Verifiche/V1.4/run_vco_frontend_v14.py 03_Verifiche/V1.4/ngspice_results
      - name: Save raw electrical evidence (never fabricable status)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v14-vco-analog-frontend-loaded-ngspice-NO-FAB-NO-TX
          path: 03_Verifiche/V1.4/ngspice_results/
          if-no-files-found: warn
