name: V2.6 KiCad9 seven-sheet independent UVLO two-NPN gate candidate
on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  native-v26-supervisor:
    runs-on: ubuntu-24.04
    timeout-minutes: 29
    steps:
      - uses: actions/checkout@v4
      - name: Deterministic CAD delta and conservative analytical screen
        run: |
          node --check 04_KiCad/V2.6/genera_uvlo_serie_v26.js
          node 04_KiCad/V2.6/genera_uvlo_serie_v26.js --check
          python3 -B 03_Verifiche/V2.6/screen_series_interlock_v26.py
          python3 -B 03_Verifiche/V2.6/audit_q802_diode_interlock_v26.py
          python3 -B 03_Verifiche/V2.6/screen_uvlo_hysteresis_v26.py
      - name: Install native KiCad9
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq software-properties-common
          sudo add-apt-repository --yes ppa:kicad/kicad-9.0-releases
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq kicad
          kicad-cli version
      - name: Register stock and local symbol and footprint libraries
        run: |
          mkdir -p "$HOME/.config/kicad/9.0"
          python3 - <<'PY'
          from pathlib import Path
          p=(Path.cwd()/"04_KiCad/V2.6").resolve()
          cfg=Path.home()/".config/kicad/9.0"
          (cfg/"sym-lib-table").write_text((p/"sym-lib-table").read_text().replace("$"+"{KIPRJMOD}",str(p)))
          stock=Path("/usr/share/kicad/template/fp-lib-table").read_text()
          local=(p/"fp-lib-table").read_text().replace("$"+"{KIPRJMOD}",str(p))
          entries=[x for x in local.splitlines() if x.strip().startswith("(lib ")]
          assert len(entries)==3
          (cfg/"fp-lib-table").write_text(stock.rstrip()[:-1]+"\n"+"\n".join(entries)+"\n)\n")
          PY
      - name: ERC0 all seven native sheets, without waivers
        run: |
          mkdir -p 03_Verifiche/V2.6/native_results
          # Diagnostic only: write actual KiCad pin-net evidence even if ERC then fails.
          # This does NOT relax the mandatory ERC gate or permit a merge.
          kicad-cli sch export netlist --output 03_Verifiche/V2.6/native_results/pre_erc_diagnostic.net 04_KiCad/V2.6/PLL_RX_HIERARCHICAL_MASTER_V2.6.kicad_sch
          kicad-cli sch erc --exit-code-violations --format json --output 03_Verifiche/V2.6/native_results/erc.json 04_KiCad/V2.6/PLL_RX_HIERARCHICAL_MASTER_V2.6.kicad_sch
      - name: Export both genuine netlists, test all preserved partitions and changed pins
        run: |
          kicad-cli sch export netlist --output 03_Verifiche/V2.6/native_results/v25_baseline.net 04_KiCad/V2.5/PLL_RX_HIERARCHICAL_MASTER_V2.5.kicad_sch
          kicad-cli sch export netlist --output 03_Verifiche/V2.6/native_results/v26_uvlo.net 04_KiCad/V2.6/PLL_RX_HIERARCHICAL_MASTER_V2.6.kicad_sch
          python3 -B 03_Verifiche/V2.6/verify_kicad_v26.py 03_Verifiche/V2.6/native_results/v25_baseline.net 03_Verifiche/V2.6/native_results/v26_uvlo.net
          python3 -B 03_Verifiche/V2.6/audit_r1011_d806_thermal_fault.py 03_Verifiche/V2.6/native_results/v26_uvlo.net
          python3 -B 03_Verifiche/V2.6/screen_ctl_rail_bias_v26.py 03_Verifiche/V2.6/native_results/v26_uvlo.net
          python3 -B 03_Verifiche/V2.6/audit_d803_gate_clamp_v26.py 03_Verifiche/V2.6/native_results/v26_uvlo.net
      - name: Export all seven native KiCad9 schematic SVG pages
        run: |
          mkdir -p 03_Verifiche/V2.6/native_results/schematic
          kicad-cli sch export svg --output 03_Verifiche/V2.6/native_results/schematic/ 04_KiCad/V2.6/PLL_RX_HIERARCHICAL_MASTER_V2.6.kicad_sch
          test "$(find 03_Verifiche/V2.6/native_results/schematic -type f -name '*.svg' | wc -l)" -ge 7
      - name: Archive audit evidence including failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V26-KiCad9-UVLO-LM393B-7sheets-NO-FAB-NO-TX
          path: 03_Verifiche/V2.6/native_results/
          if-no-files-found: warn
