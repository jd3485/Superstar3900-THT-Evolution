name: V0.6 experimental ngspice RX VCO (NO FAB NO TX)
on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  ngspice-exploratory:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install ngspice for circuit-level transient analysis
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ngspice
          ngspice --version
      - name: Sweep three bias points and measure actual model waveforms
        run: python3 -B 03_Verifiche/V0.6/run_spice_v06.py
      - name: Explore candidate RF oscillators and record failures
        if: github.event_name == 'workflow_dispatch'
        run: python3 -B 03_Verifiche/V0.6/explore_vco_v06.py
      - name: Refine candidate inductance for frequency range
        if: github.event_name == 'workflow_dispatch'
        run: python3 -B 03_Verifiche/V0.6/refine_vco_v06.py
      - name: Check reworked VCO at eight bias points
        if: github.event_name == 'workflow_dispatch'
        run: python3 -B 03_Verifiche/V0.6/run_reworked_v06.py
      - name: Test RF startup sensitivity with supply ramp and 6-15V bias
        if: github.event_name == 'workflow_dispatch'
        run: python3 -B 03_Verifiche/V0.6/run_operating_window_v06.py
      - name: Evaluate supply-ramp-only variants at 8-15 V
        if: github.event_name == 'workflow_dispatch'
        run: python3 -B 03_Verifiche/V0.6/run_ramp_scan_v06.py
      - name: Selected candidate B with realistic supply startup
        run: python3 -B 03_Verifiche/V0.6/run_selected_v06.py
      - name: Upload data and logs (not hardware qualification)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ngspice-v06-vco-sweep
          path: 03_Verifiche/V0.6/ngspice_results/
          if-no-files-found: warn
